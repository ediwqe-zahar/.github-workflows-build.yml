name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AutoClicker"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.autoclicker"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.autoclicker"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application android:label="AutoClicker" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service android:name=".FloatingService" android:exported="false" />

                  <service
                      android:name=".ClickService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/app_name" />
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">AutoClicker</string></resources>
          EOF
          mkdir -p app/src/main/java/com/example/autoclicker
          cat > app/src/main/java/com/example/autoclicker/ClickService.kt <<'EOF'
          package com.example.autoclicker

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class ClickService : AccessibilityService() {

              companion object {
                  var instance: ClickService? = null
              }

              override fun onServiceConnected() { instance = this }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun click(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 20))
                      .build()
                  dispatchGesture(gesture, null, null)
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/autoclicker
          cat > app/src/main/java/com/example/autoclicker/FloatingService.kt <<'EOF'
          package com.example.autoclicker

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs

          class FloatingService : Service() {

              private lateinit var wm: WindowManager
              private lateinit var marker: View       // точка, куда кликаем
              private lateinit var panel: TextView    // кнопка старт/стоп
              private lateinit var markerLp: WindowManager.LayoutParams
              private val handler = Handler(Looper.getMainLooper())
              private var running = false
              private var interval = 100L

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val loc = IntArray(2)
                      marker.getLocationOnScreen(loc)
                      ClickService.instance?.click(
                          loc[0] + marker.width / 2f,
                          loc[1] + marker.height / 2f
                      )
                      handler.postDelayed(this, interval)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  interval = getSharedPreferences("cfg", MODE_PRIVATE).getLong("interval", 100L)

                  val size = (64 * resources.displayMetrics.density).toInt()

                  // Маркер-прицел
                  marker = View(this).apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.argb(90, 255, 0, 0))
                          setStroke(4, Color.RED)
                      }
                  }
                  markerLp = lp(size, size, 300, 600)
                  wm.addView(marker, markerLp)
                  makeDraggable(marker, markerLp, null)

                  // Кнопка управления
                  panel = TextView(this).apply {
                      text = "▶"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.argb(220, 40, 40, 40))
                      }
                  }
                  val panelLp = lp(size, size, 40, 300)
                  wm.addView(panel, panelLp)
                  makeDraggable(panel, panelLp) { toggle() }
              }

              private fun lp(w: Int, h: Int, x: Int, y: Int) = WindowManager.LayoutParams(
                  w, h,
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                  PixelFormat.TRANSLUCENT
              ).apply {
                  gravity = Gravity.TOP or Gravity.START
                  this.x = x
                  this.y = y
              }

              private fun toggle() {
                  if (ClickService.instance == null) {
                      Toast.makeText(this, "Включите службу спец. возможностей", Toast.LENGTH_LONG).show()
                      return
                  }
                  running = !running
                  panel.text = if (running) "■" else "▶"
                  // Во время кликов маркер пропускает касания сквозь себя
                  markerLp.flags = if (running)
                      markerLp.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  else
                      markerLp.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  wm.updateViewLayout(marker, markerLp)

                  if (running) handler.post(tick) else handler.removeCallbacks(tick)
              }

              private fun makeDraggable(v: View, p: WindowManager.LayoutParams, onTap: (() -> Unit)?) {
                  var sx = 0; var sy = 0; var tx = 0f; var ty = 0f; var moved = false
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = p.x; sy = p.y; tx = e.rawX; ty = e.rawY; moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tx).toInt(); val dy = (e.rawY - ty).toInt()
                              if (abs(dx) > 10 || abs(dy) > 10) moved = true
                              if (moved) { p.x = sx + dx; p.y = sy + dy; wm.updateViewLayout(v, p) }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) onTap?.invoke()
                      }
                      true
                  }
              }

              override fun onDestroy() {
                  running = false
                  handler.removeCallbacks(tick)
                  wm.removeView(marker)
                  wm.removeView(panel)
                  super.onDestroy()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/autoclicker
          cat > app/src/main/java/com/example/autoclicker/MainActivity.kt <<'EOF'
          package com.example.autoclicker

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                  val pad = (20 * resources.displayMetrics.density).toInt()

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  root.addView(TextView(this).apply {
                      text = "1) Разрешите отображение поверх других окон\n" +
                             "2) Включите службу «AutoClicker» в спец. возможностях\n" +
                             "3) Задайте интервал и запустите панель\n" +
                             "4) Перетащите красный круг на нужное место и нажмите ▶"
                  })

                  root.addView(Button(this).apply {
                      text = "Разрешение «поверх окон»"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")))
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Включить службу спец. возможностей"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  val interval = EditText(this).apply {
                      hint = "Интервал между кликами, мс"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(prefs.getLong("interval", 100L).toString())
                  }
                  root.addView(interval)

                  root.addView(Button(this).apply {
                      text = "Запустить панель"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(context, "Сначала дайте разрешение поверх окон", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          val ms = interval.text.toString().toLongOrNull()?.coerceAtLeast(20L) ?: 100L
                          prefs.edit().putLong("interval", ms).apply()
                          stopService(Intent(context, FloatingService::class.java))
                          startService(Intent(context, FloatingService::class.java))
                          moveTaskToBack(true)
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Остановить панель"
                      setOnClickListener { stopService(Intent(context, FloatingService::class.java)) }
                  })

                  setContentView(root)
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoClicker.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: AutoClicker.apk
